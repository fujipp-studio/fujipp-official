spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:54322/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1/.well-known/jwks.json
