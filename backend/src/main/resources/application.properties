spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.audiences=${SUPABASE_JWT_AUDIENCE:authenticated}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=${SUPABASE_JWT_ALGORITHMS:ES256}

app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.rate-limit.read-requests-per-minute=${APP_RATE_LIMIT_READ_PER_MINUTE:120}
app.security.rate-limit.write-requests-per-minute=${APP_RATE_LIMIT_WRITE_PER_MINUTE:30}

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:fujipp/work}
app.cloudinary.feature-folder=${CLOUDINARY_FEATURE_FOLDER:fujipp/features}
app.cloudinary.profile-folder=${CLOUDINARY_PROFILE_FOLDER:fujipp/profiles}
app.cloudinary.max-file-size-bytes=${CLOUDINARY_MAX_FILE_SIZE_BYTES:8388608}

app.store.secret-key-base64=${STORE_SECRET_KEY_BASE64:}
app.store.secret-key-version=${STORE_SECRET_KEY_VERSION:v1}
app.runtime.runner-tokens=${RUNNER_API_TOKEN:},${RUNNER_API_PREVIOUS_TOKEN:}
app.runtime.bootstrap-cache-ttl=${RUNTIME_BOOTSTRAP_CACHE_TTL:60s}
app.voucher.truemoney.user-agent=${TRUEMONEY_USER_AGENT:fujipp-voucher/1.0}
app.voucher.truemoney.timeout-ms=${TRUEMONEY_TIMEOUT_MS:12000}

app.topup.promptpay-id=${PROMPTPAY_ID:}
app.topup.account-name=${PROMPTPAY_ACCOUNT_NAME:}
app.topup.slipok.branch-id=${SLIPOK_BRANCH_ID:}
app.topup.slipok.api-key=${SLIPOK_API_KEY:}
app.topup.minimum-satang=${TOPUP_MINIMUM_SATANG:1000}
app.topup.maximum-satang=${TOPUP_MAXIMUM_SATANG:10000000}
app.topup.expiry-minutes=${TOPUP_EXPIRY_MINUTES:15}
app.topup.max-slip-file-bytes=${TOPUP_MAX_SLIP_FILE_BYTES:5242880}

app.donation.minimum-satang=${DONATION_MINIMUM_SATANG:1000}
app.donation.maximum-satang=${DONATION_MAXIMUM_SATANG:10000000}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
