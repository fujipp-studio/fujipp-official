spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.audiences=${SUPABASE_JWT_AUDIENCE:authenticated}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=${SUPABASE_JWT_ALGORITHMS:ES256}

app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.security.rate-limit.read-requests-per-minute=${APP_RATE_LIMIT_READ_PER_MINUTE:120}
app.security.rate-limit.write-requests-per-minute=${APP_RATE_LIMIT_WRITE_PER_MINUTE:30}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
