name: Frontend CI/CD

on:
  pull_request:
    paths:
      - frontend/**
      - bot-runner/src/features/price-reader/**
      - .github/workflows/frontend-cd.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - bot-runner/src/features/price-reader/**
      - .github/workflows/frontend-cd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Select affected tests
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-affected.ts plan
      - run: bun scripts/ci-affected.ts check-map
      - run: bun run lint
      - name: Ensure lint produced no uncommitted fixes
        run: git diff --exit-code
        working-directory: .
      - run: bun scripts/ci-affected.ts unit
      - run: bun run check:tokens

  smoke:
    name: smoke (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Select affected tests
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/ci-affected.ts plan
      - name: Configure bounded HTTPS downloads for browser dependencies
        run: |
          # Avoid the Azure HTTP mirror that can stall during apt updates.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' \
              | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "2";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network >/dev/null
      - name: Install browser for isolated UI smoke tests
        timeout-minutes: 10
        run: bunx --no-install playwright install --with-deps chromium
      - run: bun scripts/ci-affected.ts smoke --shard=${{ matrix.shard }}/4

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    # Production variables remain scoped to the existing protected environment.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'frontend-production' || 'frontend-ci' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Build frontend once
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: bun run build
      - run: bun run performance:bundle
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: frontend-production
          path: frontend/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  verify:
    if: always()
    needs: [quality, smoke, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require all tests to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          SMOKE: ${{ needs.smoke.result }}
          BUILD: ${{ needs.build.result }}
        run: test "$QUALITY" = success && test "$SMOKE" = success && test "$BUILD" = success

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: frontend-production
      url: ${{ vars.FRONTEND_URL }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: frontend-production
          path: frontend/dist
      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp
        working-directory: .
      - name: Deploy dist over explicit FTPS
        env:
          FRONTEND_FTP_HOST: ${{ vars.FRONTEND_FTP_HOST }}
          FRONTEND_FTP_PORT: ${{ vars.FRONTEND_FTP_PORT }}
          FRONTEND_FTP_USER: ${{ vars.FRONTEND_FTP_USER }}
          FRONTEND_FTP_PATH: ${{ vars.FRONTEND_FTP_PATH }}
          FRONTEND_FTP_PASSWORD: ${{ secrets.FRONTEND_FTP_PASSWORD }}
        run: |
          : "${FRONTEND_FTP_HOST:?Missing FRONTEND_FTP_HOST}"
          : "${FRONTEND_FTP_PORT:?Missing FRONTEND_FTP_PORT}"
          : "${FRONTEND_FTP_USER:?Missing FRONTEND_FTP_USER}"
          : "${FRONTEND_FTP_PASSWORD:?Missing FRONTEND_FTP_PASSWORD}"

          case "$FRONTEND_FTP_PATH" in
            domains/*/public_html|/domains/*/public_html) ;;
            *) echo "Refusing unsafe FRONTEND_FTP_PATH" >&2; exit 1 ;;
          esac

          install -m 600 /dev/null "$HOME/.netrc"
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FRONTEND_FTP_HOST" "$FRONTEND_FTP_USER" "$FRONTEND_FTP_PASSWORD" \
            >"$HOME/.netrc"

          lftp -p "$FRONTEND_FTP_PORT" "$FRONTEND_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          cd "$FRONTEND_FTP_PATH"
          # Keep the currently referenced hashed assets available while the new
          # release uploads. Publishing index.html last prevents it from
          # pointing browsers at an entry module that does not exist yet.
          mirror --reverse --verbose --parallel=4 --exclude-glob index.html dist/ .
          put dist/index.html -o .index.html.next
          mv .index.html.next index.html
          bye
          LFTP
      - name: Remove temporary FTP credentials
        if: always()
        run: rm -f "$HOME/.netrc"
        working-directory: .
      - name: Verify production website
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          response=$(mktemp)
          headers=$(mktemp)
          entry=$(mktemp)
          trap 'rm -f "$response" "$headers" "$entry"' EXIT

          curl --fail --location --retry 3 --retry-delay 5 \
            --max-time 20 --header 'Cache-Control: no-cache' \
            --output "$response" "${FRONTEND_URL%/}/?deploy=$GITHUB_SHA"
          grep -q '<div id="app"></div>' "$response"

          entry_path=$(sed -n 's/.*<script[^>]*src="\([^"]*\.js\)".*/\1/p' "$response" | head -n 1)
          case "$entry_path" in
            /assets/*.js) ;;
            *) echo "Unable to find the production JavaScript entry in index.html" >&2; exit 1 ;;
          esac

          curl --fail --location --retry 3 --retry-delay 5 \
            --max-time 20 --header 'Cache-Control: no-cache' \
            --dump-header "$headers" --output "$entry" \
            "${FRONTEND_URL%/}${entry_path}?deploy=$GITHUB_SHA"
          grep -Eiq '^content-type: *(application|text)/(javascript|ecmascript)' "$headers"
          if grep -Eiq '<!doctype +html|<html' "$entry"; then
            echo "Production JavaScript entry returned HTML" >&2
            exit 1
          fi
        working-directory: .
