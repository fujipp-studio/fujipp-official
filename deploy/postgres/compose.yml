name: fujipp-postgres

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    mem_limit: 1g
    cpus: 1.0
    shm_size: 256m
    environment:
      POSTGRES_DB: fujipp_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    volumes:
      - data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d fujipp_app']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - database
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  data:

networks:
  database:
    internal: true
