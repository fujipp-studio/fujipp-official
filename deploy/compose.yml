services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    mem_limit: 2g
    environment:
      SPRING_PROFILES_ACTIVE: production
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1400m -XX:MaxMetaspaceSize=256m
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-1}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS is required}
      STORE_SECRET_KEY_BASE64: ${STORE_SECRET_KEY_BASE64:?STORE_SECRET_KEY_BASE64 is required}
      STORE_SECRET_KEY_VERSION: ${STORE_SECRET_KEY_VERSION:-v1}
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:?RUNNER_API_TOKEN is required}
      RUNNER_API_PREVIOUS_TOKEN: ${RUNNER_API_PREVIOUS_TOKEN:-}
      TRUEMONEY_USER_AGENT: ${TRUEMONEY_USER_AGENT:-fujipp-voucher/1.0}
      TRUEMONEY_TIMEOUT_MS: ${TRUEMONEY_TIMEOUT_MS:-12000}
      PROMPTPAY_ID: ${PROMPTPAY_ID:-}
      PROMPTPAY_ACCOUNT_NAME: ${PROMPTPAY_ACCOUNT_NAME:-}
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID:-}
      SLIPOK_API_KEY: ${SLIPOK_API_KEY:-}
      TOPUP_MINIMUM_SATANG: ${TOPUP_MINIMUM_SATANG:-1000}
      TOPUP_MAXIMUM_SATANG: ${TOPUP_MAXIMUM_SATANG:-10000000}
      TOPUP_EXPIRY_MINUTES: ${TOPUP_EXPIRY_MINUTES:-15}
      TOPUP_MAX_SLIP_FILE_BYTES: ${TOPUP_MAX_SLIP_FILE_BYTES:-5242880}
      DONATION_MINIMUM_SATANG: ${DONATION_MINIMUM_SATANG:-1000}
      DONATION_MAXIMUM_SATANG: ${DONATION_MAXIMUM_SATANG:-10000000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_PROFILE_FOLDER: ${CLOUDINARY_PROFILE_FOLDER:-fujipp/profiles}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

  bot-runner:
    build:
      context: ../bot-runner
    restart: unless-stopped
    init: true
    mem_limit: 1500m
    environment:
      NODE_OPTIONS: --max-old-space-size=1152
      BACKEND_API_URL: http://backend:8080
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:?RUNNER_API_TOKEN is required}
      RUNTIME_POLL_INTERVAL_MS: ${RUNTIME_POLL_INTERVAL_MS:-30000}
      BOT_WORKER_MAX_OLD_SPACE_MB: ${BOT_WORKER_MAX_OLD_SPACE_MB:-256}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
