<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Fujipp mascot with changing pixel faces</title>
  <style>
    .face { opacity: 0; animation: show-face 24s steps(1, end) infinite; }
    .face:nth-of-type(1) { animation-delay: 0s; }
    .face:nth-of-type(2) { animation-delay: -22s; }
    .face:nth-of-type(3) { animation-delay: -20s; }
    .face:nth-of-type(4) { animation-delay: -18s; }
    .face:nth-of-type(5) { animation-delay: -16s; }
    .face:nth-of-type(6) { animation-delay: -14s; }
    .face:nth-of-type(7) { animation-delay: -12s; }
    .face:nth-of-type(8) { animation-delay: -10s; }
    .face:nth-of-type(9) { animation-delay: -8s; }
    .face:nth-of-type(10) { animation-delay: -6s; }
    .face:nth-of-type(11) { animation-delay: -4s; }
    .face:nth-of-type(12) { animation-delay: -2s; }
    @keyframes show-face {
      0%, 8.32% { opacity: 1; }
      8.33%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .face { animation: none; }
      .face:first-of-type { opacity: 1; }
    }
  </style>
  <path id="mascot-body" d="M540 92L1057 988H23L540 92Z" fill="inherit"/>
